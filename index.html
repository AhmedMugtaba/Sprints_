<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sprints · Seed to Fruit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sprints brings together 8–12 people who have spent years inside a problem. Two weeks of intensive work, and everyone in the room owns a piece of what gets built." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ─────────────────────────────────────────────────────────────
       Design tokens — dark theme (committed).
       ───────────────────────────────────────────────────────────── */
    :root {
      --bg: #14120f;
      --panel: #1c1a16;
      --panel-deep: #100e0b;
      --ink: #ece8de;
      --ink-soft: #bcb6a6;
      --muted: #8a8576;
      --muted-soft: #5e5a4f;
      --line: rgba(236,232,222,0.14);
      --line-soft: rgba(236,232,222,0.08);
      --img-base: #211d17;
      --img-stripe: rgba(236,232,222,0.05);
      --green: #9bbf6b;
      --soft-fill: rgba(236,232,222,0.04);

      /* One accent ships: orange. oklch so hues stay perceptually matched. */
      --accent: oklch(0.72 0.17 45);
      --accent-tint: rgba(232,99,42,.07);

      --overlay-ink: #f4f0e6;
      --overlay-soft: rgba(244,240,230,0.72);

      --display: "Archivo", "Inter Tight", ui-sans-serif, system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
    body { color: var(--ink); font-family: var(--display); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    h1, h2, h3, p { margin: 0; }

    /* Panels are navigated, not scrubbed — hide scrollbars. */
    .sb-scroll::-webkit-scrollbar { width: 0; height: 0; }
    .sb-scroll { scrollbar-width: none; }

    /* ── Motion ── */
    @keyframes sbBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    .sb-bounce { animation: sbBounce 1.6s ease-in-out infinite; display: inline-block; }
    @keyframes sbFeedIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .sb-feedin { animation: sbFeedIn 420ms ease both; }
    @keyframes sbPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .sb-pulse { animation: sbPulse 1.4s ease-in-out infinite; }

    /* ── Hero key:value jump nav ── */
    .sb-hint { appearance: none; border: none; background: transparent; cursor: pointer; font-family: var(--mono); }
    .sb-key {
      appearance: none; border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: inherit; text-align: right; padding: 1px 0;
      transition: color 150ms ease; display: block; text-decoration: none; margin-top: 6px;
    }
    .sb-key .sb-kl { color: var(--muted); transition: color 150ms ease; }
    .sb-key .sb-ks { color: var(--muted-soft); }
    .sb-key .sb-kv { color: var(--ink-soft); font-variant-numeric: tabular-nums; transition: color 150ms ease; }
    .sb-key:hover .sb-kl, .sb-key:hover .sb-kv { color: var(--accent); }

    /* ─────────────────────────────────────────────────────────────
       Type roles. Mono is for machine language: eyebrows, cohort
       codes, dates, status, key/value metadata, chips, buttons —
       plus the hero lede, which is deliberately terminal-voiced.
       The display face carries every headline and every paragraph.
       ───────────────────────────────────────────────────────────── */
    .eyebrow {
      font-family: var(--mono); font-weight: 500; font-size: clamp(11px, 1vw, 13px);
      letter-spacing: .2em; text-transform: uppercase; color: var(--accent);
    }
    .label {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em;
      text-transform: uppercase; color: var(--muted-soft);
    }
    .head { display: flex; gap: 2.4em; flex-wrap: wrap; }
    .head--center { justify-content: center; }
    .prose { font-family: var(--display); font-weight: 400; line-height: 1.55; text-wrap: pretty; color: var(--muted); }

    /* ── Deck & panels ──
       No `scroll-behavior: smooth` here: it would animate every direct
       scrollTop write and fight the scripted jumps. Smoothness is opted
       into per-call in goTo(). `scroll-snap-stop: always` keeps a wheel
       flick to exactly one panel; goTo() lifts snapping while it runs,
       because that rule otherwise halts a multi-panel jump partway. */
    .deck { height: 100vh; height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory; overscroll-behavior: contain; }
    .deck.is-jumping { scroll-snap-type: none; }
    .panel { height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg); position: relative; }

    /* ── Top bar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 34px; pointer-events: none;
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .2em;
      text-transform: uppercase; color: var(--ink);
    }
    .topbar > div { display: flex; gap: 12px; align-items: center; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
    .topbar .brand { font-weight: 500; }
    .topbar .sect { color: var(--muted); }
    .topbar .count { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
    .topbar .count-of { color: var(--muted); }

    /* ── Dot nav ── */
    .dotnav {
      position: fixed; right: 26px; top: 50%; transform: translateY(-50%);
      z-index: 40; display: flex; flex-direction: column; gap: 13px; align-items: center;
    }
    .dotnav button { appearance: none; border: none; background: transparent; cursor: pointer; padding: 4px; display: flex; align-items: center; }
    .dotnav span { width: 7px; height: 7px; border-radius: 4px; display: block; background: var(--muted); opacity: .32; transition: all 220ms ease; }
    .dotnav button[data-sprint] span { opacity: .5; }
    .dotnav button[aria-current="true"] span { width: 22px; background: var(--accent); opacity: 1; }

    /* ── Scroll hint ── */
    .hint {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 40;
      font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; gap: 9px; padding: 4px 8px;
      text-shadow: 0 1px 8px rgba(0,0,0,.35);
    }
    .hint[hidden] { display: none; }
    .hint .arrow { color: var(--accent); }

    /* ── 00 · Hero ── */
    .hero {
      height: 100%; display: flex; flex-direction: column; justify-content: center;
      max-width: 2100px; margin: 0 auto; position: relative;
      padding: clamp(40px,5.5vh,96px) clamp(30px,5vw,110px);
    }
    .hero__eyebrow { margin-bottom: clamp(26px,4.5vh,50px); }
    .hero__wordmark { display: flex; align-items: flex-end; gap: .06em; line-height: .8; }
    .hero__wordmark h1 {
      font-family: var(--display); font-weight: 800;
      font-size: clamp(72px,14.5vw,224px); letter-spacing: -0.04em; color: var(--ink); line-height: .8;
    }
    .hero__mark {
      width: clamp(30px,5.4vw,86px); height: clamp(12px,2.1vw,32px);
      background: var(--accent); margin-bottom: clamp(6px,1.2vw,20px); display: inline-block;
    }
    .hero__lede {
      margin: clamp(26px,3.6vh,50px) 0 0;
      font-family: var(--mono); font-weight: 400;
      font-size: clamp(19px,2.5vw,40px); line-height: 1.16; letter-spacing: -0.01em;
      color: var(--muted); max-width: 26ch;
    }
    .hero__lede .caret { color: var(--accent); margin-right: .35em; }
    .hero__counts {
      margin-top: clamp(34px,5vh,70px); display: flex; gap: clamp(16px,2vw,32px);
      flex-wrap: wrap; align-items: center;
      font-family: var(--mono); font-size: clamp(12px,1vw,15px); letter-spacing: .05em; color: var(--muted);
    }
    .hero__counts b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
    .hero__counts .sep { color: var(--muted-soft); }
    .hero__jump {
      position: absolute; top: clamp(56px,9vh,104px); right: clamp(64px,7vw,120px);
      text-align: right; display: flex; flex-direction: column; gap: 5px;
      font-family: var(--mono); font-size: clamp(11px,.95vw,14px); letter-spacing: .02em;
    }

    /* ── 01 · Thesis ── */
    .thesis {
      height: 100%; display: flex; flex-direction: column; justify-content: center;
      align-items: center; text-align: center; padding: clamp(40px,6vw,120px);
    }
    .thesis .eyebrow { margin-bottom: clamp(28px,5vh,56px); }
    .thesis p {
      font-family: var(--display); font-weight: 700;
      font-size: clamp(30px,4.6vw,80px); line-height: 1.05; letter-spacing: -0.03em;
      color: var(--ink); text-wrap: balance; max-width: clamp(680px,60vw,1180px);
    }

    /* ── 02 · The room (builders) ── */
    .room { height: 100%; display: flex; flex-direction: column; align-items: center; overflow: hidden; padding: clamp(52px,7.5vh,96px) 0 0; }
    .room .head { margin-bottom: clamp(16px,2.6vh,30px); justify-content: center; }
    .room h2 {
      font-family: var(--display); font-weight: 700;
      font-size: clamp(38px,6.4vw,112px); line-height: .94; letter-spacing: -0.04em;
      color: var(--ink); text-align: center; text-wrap: balance;
    }
    .room__sub {
      margin-top: clamp(16px,2.4vh,28px); font-size: clamp(15px,1.3vw,19px);
      text-align: center; max-width: 52ch; padding: 0 24px;
    }
    /* Solid accent button — the committed CTA treatment. */
    .btn-solid {
      appearance: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 14px;
      padding: 15px 26px; border-radius: 2px; background: var(--accent); color: #141210;
      font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .06em; text-decoration: none;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }
    .btn-solid:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -8px var(--accent); }
    .room .btn-solid { margin-top: clamp(20px,3vh,34px); padding: 14px 26px; }

    .rail {
      position: relative; flex: 1; width: 100%; min-height: 0;
      margin: clamp(10px,2vh,28px) 0 clamp(14px,3vh,36px); cursor: grab; touch-action: pan-y;
    }
    .rail.is-dragging { cursor: grabbing; }
    .bld {
      position: absolute; left: 50%; top: 50%; width: var(--bld-cw, 268px);
      aspect-ratio: 0.68; transform-origin: center center; will-change: transform, opacity;
    }
    .bld__frame { position: absolute; inset: 0; overflow: hidden; border-radius: 2px; background: var(--img-base); border: 1px solid var(--line); }
    .bld__photo { position: absolute; inset: 0; background-size: cover; filter: grayscale(1) contrast(1.03); }
    .bld__placeholder {
      position: absolute; inset: 0; background-color: var(--img-base);
      background-image: repeating-linear-gradient(135deg, var(--img-stripe) 0 1.5px, transparent 1.5px 13px);
    }
    .bld__scrim {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(to bottom, rgba(10,9,7,0.82) 0%, rgba(10,9,7,0.34) 34%, rgba(10,9,7,0) 62%);
    }
    .bld__text { position: absolute; top: 7%; left: 8%; right: 8%; text-align: left; pointer-events: none; }
    .bld__chip {
      display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 2px;
      background: rgba(20,18,15,0.55); border: 1px solid rgba(244,240,230,0.18);
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em;
      text-transform: uppercase; color: var(--overlay-ink); white-space: nowrap;
    }
    .bld__chip .dot { color: var(--accent); }
    .bld--filled .bld__chip { margin-bottom: 14px; }
    .bld__line {
      font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.2;
      letter-spacing: -0.025em; color: var(--overlay-ink); text-wrap: balance;
    }
    .bld__sprint {
      margin-top: 10px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em;
      text-transform: uppercase; color: rgba(244,240,230,0.6);
    }

    /* ── 03–06 · Sprint panels (Split) ── */
    .sprint { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
    .sprint__visual { position: relative; overflow: hidden; background: var(--img-base); }
    /* The partner shot is landscape in a tall column, so plain `cover`
       has to over-zoom and clip ~40% of the frame. `--img-fit` lets a
       sprint pull the scale back below cover: the photo then stops
       short of the panel floor and the dark field carries the overlay.
       Set `imgFit` per sprint in the data block; omit it for cover. */
    .sprint__photo {
      position: absolute; inset: 0;
      background-size: var(--img-fit, cover);
      background-repeat: no-repeat;
      filter: grayscale(1) contrast(1.02);
    }
    /* When --img-fit pulls the scale below cover the photo no longer
       reaches the panel floor, so fade its lower edge out instead of
       leaving a hard seam against --img-base. No-op under cover. */
    .sprint__photo[style*="--img-fit"] {
      -webkit-mask-image: linear-gradient(to bottom, #000 0 52%, transparent 88%);
              mask-image: linear-gradient(to bottom, #000 0 52%, transparent 88%);
    }
    .sprint__placeholder {
      position: absolute; inset: 0; background-color: var(--img-base);
      background-image: repeating-linear-gradient(135deg, var(--img-stripe) 0 1.5px, transparent 1.5px 13px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .sprint__initials {
      width: 96px; height: 96px; border-radius: 50%; border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center; color: var(--accent);
      font-family: var(--mono); font-size: 30px; font-weight: 500;
    }
    .sprint__ph-note { font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .sprint__ph-name { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); letter-spacing: .02em; }
    .sprint__scrim {
      position: absolute; left: 0; right: 0; bottom: 0; height: 68%; pointer-events: none;
      background: linear-gradient(to top, rgba(8,7,5,0.94) 0%, rgba(8,7,5,0.78) 26%, rgba(8,7,5,0.32) 58%, rgba(8,7,5,0) 100%);
    }
    .sprint__overlay { position: absolute; left: 48px; right: 48px; bottom: 54px; }
    .sprint__head {
      font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: .2em;
      text-transform: uppercase; margin-bottom: 22px; display: flex; gap: 2.4em; flex-wrap: wrap;
    }
    .sprint__head .code { color: var(--overlay-soft); }
    .sprint__space {
      font-family: var(--display); font-size: clamp(40px,4.4vw,70px); font-weight: 700;
      line-height: .94; letter-spacing: -0.04em; color: var(--overlay-ink); margin-bottom: 20px;
    }
    .sprint__partner {
      font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em;
      color: var(--overlay-ink); margin-bottom: 7px;
    }
    .sprint__credential { font-family: var(--mono); font-size: 12px; color: var(--overlay-soft); line-height: 1.55; letter-spacing: .01em; }
    .sprint__progress-pill {
      display: inline-flex; align-items: center; gap: 9px; margin-top: 20px;
      padding: 7px 14px; border-radius: 2px; border: 1px solid var(--accent); background: rgba(10,9,7,0.35);
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--overlay-ink);
    }
    .sprint__progress-pill .dot { color: var(--accent); }
    .sprint__progress-pill--done { border-color: var(--green); }
    .sprint__progress-pill--done .dot { color: var(--green); }
    /* Space tag sits under the problem title when a sprint has both. */
    .sprint__spacetag {
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--overlay-soft); margin: -10px 0 18px;
    }
    .sprint__spacetag .sep { margin: 0 .9em; opacity: .5; }

    /* Cross-link between the two rounds of the same problem. */
    .xref {
      appearance: none; border: none; background: transparent; cursor: pointer;
      align-self: flex-start; text-align: left; padding: 0; margin-top: -6px;
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--muted);
      transition: color 150ms ease;
    }
    .xref span { color: var(--accent); transition: transform 150ms ease; display: inline-block; }
    .xref:hover { color: var(--accent); }
    .xref:hover span { transform: translateX(4px); }

    .sponsor-lockup { display: flex; align-items: center; gap: 12px; }
    .sponsor-lockup__mark {
      width: 42px; height: 42px; border-radius: 2px; flex: 0 0 42px;
      background: rgba(244,240,230,0.1); border: 1px solid rgba(244,240,230,0.3);
      background-image: repeating-linear-gradient(135deg, rgba(244,240,230,0.12) 0 1.5px, transparent 1.5px 9px);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--overlay-ink);
    }
    .sponsor-lockup__label {
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(244,240,230,0.62); margin-bottom: 3px;
    }
    .sponsor-lockup__name { font-family: var(--mono); font-size: 13.5px; font-weight: 500; color: var(--overlay-ink); }
    .sponsor-lockup__wrap { margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid rgba(244,240,230,0.22); }

    .sprint__info {
      background: var(--panel); display: flex; flex-direction: column; justify-content: center;
      padding: clamp(32px,5vh,72px) clamp(48px,5vw,96px); gap: clamp(18px,2.6vh,34px);
      overflow-y: auto; max-height: 100%;
    }
    .sprint__info--building {
      justify-content: flex-start; gap: clamp(15px,2.1vh,26px);
      padding: clamp(70px,9vh,96px) clamp(48px,5vw,96px) clamp(28px,4vh,56px);
    }
    .sprint__oneline {
      font-family: var(--display); font-size: clamp(28px,2.8vw,42px); font-weight: 600;
      line-height: 1.1; letter-spacing: -0.03em; color: var(--ink); text-wrap: balance;
    }
    .sprint__problem {
      font-family: var(--display); font-size: 17.5px; font-weight: 400; line-height: 1.55;
      letter-spacing: -0.005em; color: var(--ink-soft); text-wrap: pretty; max-width: 46ch;
    }
    .sprint__nowbuilding {
      font-family: var(--display); font-size: clamp(23px,2.3vw,32px); font-weight: 600;
      line-height: 1.18; letter-spacing: -0.025em; color: var(--ink); text-wrap: balance;
    }

    .metagrid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; }
    .metagrid > div { display: flex; flex-direction: column; gap: 6px; }
    .metagrid .val { font-family: var(--mono); font-size: 14px; color: var(--ink); }

    .block { border-top: 1px solid var(--line); padding-top: 24px; }
    .block--problem { padding-top: 26px; }
    .block__label { display: block; margin-bottom: 12px; }
    .block__head {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted-soft);
    }

    .roster { display: flex; flex-direction: column; }
    .roster__row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line-soft); }
    .roster__row:first-child { border-top: none; }
    .avatar {
      width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%;
      border: 1px solid var(--accent); color: var(--accent); background: var(--soft-fill);
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .02em;
    }
    .roster__name { font-family: var(--mono); font-size: 13.5px; color: var(--ink); margin-bottom: 2px; }
    .roster__role { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .02em; }
    .roster__li {
      flex: 0 0 auto; padding: 5px 10px; border-radius: 2px; border: 1px solid var(--line);
      color: var(--muted); text-decoration: none;
      font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
      transition: color 150ms ease, border-color 150ms ease;
    }
    .roster__li:hover { color: var(--accent); border-color: var(--accent); }

    /* Room updates — 'Changelog' variant (the committed style). */
    .feed { display: flex; flex-direction: column; }
    .feed__item { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; padding-bottom: 18px; }
    .feed__item:last-child { padding-bottom: 0; }
    .feed__rail { display: flex; flex-direction: column; align-items: center; padding-top: 3px; }
    .feed__node { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; flex: 0 0 auto; }
    .feed__item:first-child .feed__node { background: var(--accent); }
    .feed__stem { flex: 1; width: 1px; background: var(--line); margin-top: 4px; }
    .feed__when { font-family: var(--mono); font-size: 10.5px; color: var(--muted-soft); margin-bottom: 5px; letter-spacing: .02em; }
    .feed__when b { color: var(--accent); font-weight: 400; }
    .feed__title { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 5px; }
    .feed__body { font-family: var(--display); font-size: 13.5px; line-height: 1.5; color: var(--muted); text-wrap: pretty; }

    /* Sponsor detail block, right-hand info panel */
    .sponsor-strip { border-top: 1px solid var(--line); padding-top: 22px; }
    .sponsor-strip__label { margin-bottom: 14px; }
    .sponsor-strip__row { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
    .sponsor-strip__mark {
      width: 48px; height: 48px; border-radius: 2px; flex: 0 0 48px;
      background: var(--soft-fill); border: 1px solid var(--line);
      background-image: repeating-linear-gradient(135deg, var(--img-stripe) 0 1.5px, transparent 1.5px 9px);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--ink);
    }
    .sponsor-strip__name { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--ink); }
    .sponsor-strip__kind { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .02em; }
    .plus-list { display: flex; flex-direction: column; gap: 8px; }
    .plus-list div { display: flex; gap: 11px; align-items: baseline; font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }
    .plus-list .plus { color: var(--accent); }

    /* The sprint's research question — the one pull-quote on the page. */
    .question { border-left: 2px solid var(--accent); padding-left: 20px; }
    .question__body {
      font-family: var(--display); font-weight: 600; font-size: clamp(16px, 1.5vw, 20px);
      line-height: 1.35; letter-spacing: -0.015em; color: var(--ink); text-wrap: pretty; max-width: 44ch;
    }

    /* Designed empty state for copy that has not landed yet. */
    .tbc {
      font-family: var(--mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted-soft); border: 1px dashed var(--line); border-radius: 2px;
      padding: 14px 16px;
      background-image: repeating-linear-gradient(135deg, var(--img-stripe) 0 1.5px, transparent 1.5px 13px);
    }
    .avatar--pending { border-style: dashed; }
    /* Photo avatars: grayscale to sit inside the board's one-accent
       palette, since these arrive as mixed-colour LinkedIn headshots. */
    .avatar--photo {
      background-size: cover; background-position: center top;
      filter: grayscale(1) contrast(1.02); border-color: var(--line);
    }

    /* ── 07 · Equity ── */
    .equity {
      height: 100%; display: flex; flex-direction: column; justify-content: center;
      max-width: 1360px; margin: 0 auto; width: 100%;
      padding: clamp(40px,6vh,88px) clamp(56px,6vw,110px) clamp(40px,6vh,88px) clamp(30px,5vw,96px);
    }
    .equity .head { margin-bottom: clamp(20px,3.5vh,38px); }
    .equity__figure { display: flex; align-items: flex-start; gap: 8px; color: var(--accent); }
    .equity__figure .n { font-family: var(--display); font-weight: 800; font-size: clamp(120px,18vw,220px); line-height: .82; letter-spacing: -0.05em; }
    .equity__figure .pct { font-family: var(--display); font-weight: 700; font-size: clamp(38px,5.2vw,64px); margin-top: clamp(8px,1.6vh,14px); }
    .equity h2 {
      margin: clamp(18px,2.6vh,28px) 0 0;
      font-family: var(--display); font-weight: 700; font-size: clamp(24px,3vw,42px);
      line-height: 1.08; letter-spacing: -0.03em; color: var(--ink); max-width: 22ch; text-wrap: balance;
    }
    .equity__rows {
      display: flex; gap: clamp(30px,4.5vw,64px); margin-top: clamp(28px,4.5vh,52px);
      border-top: 1px solid var(--line); padding-top: clamp(22px,3vh,34px);
      align-items: flex-start; flex-wrap: wrap;
    }
    .equity__rows .n { font-family: var(--display); font-weight: 700; font-size: clamp(26px,3.2vw,40px); letter-spacing: -0.02em; color: var(--accent); }
    .equity__rows .l { font-family: var(--mono); font-size: clamp(11px,1vw,13px); color: var(--muted); margin-top: 6px; }
    .equity__note { flex: 1; max-width: 38ch; margin-left: auto; min-width: 28ch; font-size: clamp(14px,1.15vw,17px); }

    /* ── 08 · Why sprints ── */
    .why {
      height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: clamp(56px,8vh,110px) clamp(56px,6vw,110px);
    }
    .why .head { margin-bottom: clamp(20px,3.5vh,38px); }
    .why--bet .head { margin-bottom: clamp(28px,5vh,56px); }
    .why__stat { font-family: var(--display); font-weight: 800; font-size: clamp(96px,17vw,240px); line-height: .86; letter-spacing: -0.05em; color: var(--accent); }
    .why h2 { margin: clamp(14px,2.2vh,26px) 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(30px,4vw,58px); letter-spacing: -0.03em; color: var(--ink); }
    .why--bet h2 { margin: 0; font-size: clamp(38px,6vw,104px); line-height: 1; letter-spacing: -0.04em; max-width: 15ch; text-wrap: balance; }
    .why__body { margin: clamp(22px,3vh,34px) 0 0; font-size: clamp(15px,1.3vw,19px); max-width: 54ch; }
    .why--bet .why__body { margin-top: clamp(26px,3.5vh,44px); max-width: 58ch; }

    /* ── 09 · How it works ── */
    .how {
      height: 100%; display: flex; flex-direction: column; justify-content: center;
      max-width: 1360px; margin: 0 auto; width: 100%;
      padding: clamp(40px,6vh,88px) clamp(56px,6vw,110px) clamp(76px,9vh,116px) clamp(30px,5vw,96px);
      gap: clamp(18px,3vh,34px);
    }

    /* Page footer — pinned to the bottom of the final panel. */
    .footer {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: space-between; gap: 12px;
      padding: 24px clamp(30px,5vw,96px);
      border-top: 1px solid var(--line);
      font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
      color: var(--muted);
    }
    .step {
      position: relative; display: flex; align-items: center;
      min-height: clamp(120px,18vh,168px); padding: clamp(14px,2.2vh,26px) 0;
      border-top: 1px solid var(--line);
    }
    .step:last-child { border-bottom: 1px solid var(--line); }
    .step__ghost {
      position: absolute; left: -0.06em; font-family: var(--display); font-weight: 800;
      font-size: clamp(72px,9vw,132px); line-height: 1; letter-spacing: -0.04em;
      color: var(--ink); opacity: .055; pointer-events: none;
    }
    .step__body { position: relative; padding-left: clamp(96px,13vw,190px); }
    .step__body h3 { font-family: var(--display); font-weight: 700; font-size: clamp(22px,2.6vw,32px); letter-spacing: -0.02em; color: var(--ink); margin-bottom: 6px; }
    .step__body p { font-size: clamp(14px,1.1vw,17px); max-width: 68ch; }

    /* ─────────────────────────────────────────────────────────────
       Responsive.
       The prototype is desktop-only and defers mobile to the
       designer. This is a conservative fallback so the page works
       on phones — not a designed breakpoint. Flag for review.
       ───────────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      /* `height: 100%` has to go with the overflow change, or body stays a
         fixed-height scroll container — which on iOS Safari suppresses the
         address-bar collapse and the document-level momentum scroll. */
      html, body { height: auto; overflow: visible; }
      .deck { scroll-snap-type: none; height: auto; overflow: visible; }
      /* Sections declare `height: 100%`, which collapses to auto against an
         auto-height panel — so their `justify-content: center` stopped
         working and every panel sat top-aligned above a screenful of dead
         space. Stretching the child restores the centring. */
      .panel { height: auto; min-height: 100svh; scroll-snap-align: none; display: flex; flex-direction: column; }
      .panel > * { flex: 1 0 auto; }
      .dotnav, .hint { display: none; }
      /* The bar floats over near-white portrait crops on the sprint
         panels; a scrim keeps the wordmark legible. */
      .topbar {
        padding: 14px 18px; font-size: 10px;
        background: linear-gradient(to bottom, rgba(10,9,7,0.92) 0%, rgba(10,9,7,0.72) 55%, rgba(10,9,7,0) 100%);
        padding-bottom: 22px;
      }
      .topbar .sect { display: none; }

      .hero { padding: clamp(72px,16vh,110px) 22px 48px; }
      .hero__lede { font-size: clamp(19px,5.4vw,28px); max-width: none; }
      /* Mobile hides the dot nav and scroll hint, which left the page with
         no navigation at all. The jump list is the only table of contents,
         so it moves into the flow rather than disappearing. */
      .hero__jump {
        position: static; text-align: left; margin-top: clamp(28px,5vh,48px);
        gap: 0; font-size: 13px;
      }
      .sb-key { text-align: left; margin-top: 0; padding: 14px 0; }

      .sprint { grid-template-columns: 1fr; }
      .sprint__visual { min-height: 76svh; }
      .sprint__overlay { left: 22px; right: 22px; bottom: 30px; }
      .sprint__info, .sprint__info--building { padding: 34px 22px 56px; overflow: visible; max-height: none; }
      .metagrid { gap: 16px 24px; }

      .thesis, .why, .equity, .how { padding-left: 22px; padding-right: 22px; }
      .equity__note { margin-left: 0; }
      .footer { flex-direction: column; gap: 8px; padding: 20px 22px; }
      .step { align-items: flex-start; }
      .step__body { padding-left: 0; padding-top: 30px; }
      .step__ghost { font-size: 56px; top: -4px; }

      .room { padding: clamp(72px,14vh,110px) 0 48px; }
      /* `align-items: center` matters: the default stretch overrode the
         cards' 0.68 aspect ratio, squeezing every portrait to 0.49 and
         pushing the panel past the viewport. */
      .rail {
        display: flex; align-items: center; gap: 14px; overflow-x: auto; overflow-y: hidden;
        scroll-snap-type: x mandatory; padding: 0 22px; cursor: default;
        -webkit-overflow-scrolling: touch; flex: 0 0 auto;
      }
      .rail::-webkit-scrollbar { height: 0; }
      .bld {
        position: relative; left: auto; top: auto; transform: none !important;
        opacity: 1 !important; visibility: visible !important;
        flex: 0 0 62vw; max-width: 280px; scroll-snap-align: center;
      }
      .bld__text { opacity: 1 !important; }

      /* Touch targets: these sit at 26–30px, below the 44px minimum.
         Padding grows the hit area without moving the type. */
      .roster__li { padding: 14px 16px; }
      .xref { padding: 8px 0; margin-top: -10px; }
    }

    /* ── Reduced motion — the prototype omitted this; required. ── */
    @media (prefers-reduced-motion: reduce) {
      .deck { scroll-behavior: auto; }
      .sb-bounce, .sb-pulse, .sb-feedin { animation: none !important; }
      .sb-feedin { opacity: 1; transform: none; }
      * { transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>

  <header class="topbar" role="banner">
    <div>
      <span style="color:var(--accent)">●</span>
      <span class="brand">Seed to Fruit</span>
    </div>
    <div id="topbar-right"></div>
  </header>

  <nav class="dotnav" id="dotnav" aria-label="Panel navigation"></nav>

  <main class="deck sb-scroll" id="deck"></main>

  <button class="sb-hint hint" id="hint" hidden>
    <span id="hint-label"></span> <span class="sb-bounce arrow">↓</span>
  </button>

<script>
(function () {
  'use strict';

  var REQUEST_URL = 'request.html';

  /* ───────────────────────────────────────────────────────────────
     DATA — everything the page renders comes from this block.

     `phase` drives which panel treatment a cohort gets:
       'open'    — accepting applications, shows the join CTA
       'wrapped' — finished, shows outcome / founders / room / posts

     Anything still unknown is left null. The renderers fall back to
     the designed `[ ... ]` empty state rather than inventing copy,
     so it is safe to ship with gaps and fill them in as they land.
     ─────────────────────────────────────────────────────────────── */
  var SPRINTS = [
    {
      code: 'cohort_02',
      phase: 'open',
      partner: 'Maien Hamed',
      credential: '17 yrs · ex-Meta Reality Labs · PhD, computational mechanics',
      space: 'Spatial AI',
      title: 'Simulation Copilot',
      round: 'Round 02 on this problem',
      continues: 'cohort_01',
      oneLine: 'Turn informal engineering intent into explicit, spatially grounded simulation.',
      problem: 'Engineers still hand-translate what they mean into solver input. Two weeks to build a solver-neutral layer that reads natural language, clicks, and annotated screenshots, resolves them to explicit CAD faces and nodes, shows its interpretation in 3D for correction, and exports a solver-ready script.',
      question: 'Can a multimodal model reliably translate informal engineering instructions and visual references into explicit, spatially grounded simulation entities?',
      ships: [
        'Natural language → grounded loads and constraints',
        'Click and annotated-screenshot grounding onto 3D entities',
        'A solver-neutral simulation-intent schema',
        'One solver export adapter'
      ],
      dates: 'Dates TBC · 2026',
      location: 'Remote-first',
      team: '8–12 in the room',
      status: 'OPEN', statusNote: 'accepting applications',
      img: 'maien-portrait.png', imgPos: '90% top', imgFit: 'auto 84%'
    },
    {
      code: 'cohort_01',
      phase: 'wrapped',
      partner: 'Maien Hamed',
      credential: '17 yrs · ex-Meta Reality Labs · PhD, computational mechanics',
      space: 'Spatial AI',
      title: 'Simulation Copilot',
      round: 'Round 01 on this problem',
      dates: 'Dates TBC · 2026',
      location: 'Remote-first',
      team: '6 in the room',
      status: 'WRAPPED', statusNote: 'sprint complete',
      img: 'maien-portrait.png', imgPos: '90% top', imgFit: 'auto 84%',

      // Same problem the open sprint continues — stated, not claimed:
      // this describes what the room took on, not what it concluded.
      problem: 'Engineers describe loads and boundary conditions in words, sketches, and screenshots — then hand-translate all of it into solver input. Cohort 01 spent two weeks on whether that informal intent can be resolved automatically into explicit, spatially grounded simulation entities.',

      // Company is deliberately unannounced — the empty state stands in.
      company: null,      // { name, line, what, stage }

      // The two who continued out of the room.
      founders: [
        { name: 'Ahmed', li: 'https://www.linkedin.com/in/jrhoss/', img: 'ahmed.jpg' },
        { name: 'Fady' }
      ],

      // Roles are intentionally blank: LinkedIn blocks automated reads
      // (HTTP 999), so nothing here is guessed. Add `role` for a second
      // line, `img` to swap the initials circle for a portrait.
      room: [
        { name: 'Islam Alaa',  li: 'https://www.linkedin.com/in/islamalaa/',            img: 'islam-alaa.png' },
        { name: 'Rajat Arora', li: 'https://www.linkedin.com/in/rajat-arora-3a1a48161/', img: 'rajat-arora.jpg' },
        { name: 'Rohan Doshi', li: 'https://www.linkedin.com/in/rd-rohan-doshi/',        img: 'rohan-doshi.jpg' },
        { name: 'Dan Mehta',   li: 'https://www.linkedin.com/in/dan-mehta/',             img: 'dan-mehta.jpg' },
        { name: 'Ahmed',       li: 'https://www.linkedin.com/in/jrhoss/',                img: 'ahmed.jpg' },
        { name: 'Fady' }
      ],

      // Updates pulled for now — the section hides itself when null.
      posts: null
    }
  ];

  // The rail. Maien first, then the cohort_01 room.
  // Cards without a photo keep the designed striped empty state, and
  // the achievement line only renders once a portrait exists.
  // `line` only renders once a portrait exists — that is the designed
  // behaviour, so a card with a photo and no achievement line shows the
  // name chip alone rather than an empty headline.
  var BUILDERS = [
    { name: 'Maien H.', sprint: 'Host · Spatial AI', img: 'maien-portrait.png', imgPos: '72% 18%' },
    { name: 'Islam A.', sprint: 'Spatial AI', img: 'islam-alaa.png' },
    { name: 'Rajat A.', sprint: 'Spatial AI', img: 'rajat-arora.jpg' },
    { name: 'Rohan D.', sprint: 'Spatial AI', img: 'rohan-doshi.jpg' },
    { name: 'Dan M.',   sprint: 'Spatial AI', img: 'dan-mehta.jpg' },
    { name: 'Ahmed',    sprint: 'Spatial AI', img: 'ahmed.jpg' }
    // Fady omitted until a portrait lands — he stays in the roster and
    // the founders list, where the initials avatar is the designed state.
  ];

  var STEPS = [
    ['01', 'A problem is chosen.', 'Seed to Fruit starts by picking something that is worth working on: an industry, a problem, or an idea. Something like "How homes get built", or "Teaching kids a second language". Real, specific, hard.'],
    ['02', 'A room is assembled.', 'We try to find 8 to 12 people who are the most relevant to the problem, people who know the industry in and out, engineers who’ve been hacking on it, founders who tried and failed, designers who’ve been thinking about it for years.'],
    ['03', 'Two weeks, remote.', 'Conditions designed and engineered for something to emerge. The Host anchors judgment. Everyone works on the problem together, no pitches, no demo days, just the work.'],
    ['04', 'A founding team is selected.', 'At the end, Seed to Fruit and the Host invite 3-5 of the strongest to form a company. Everyone else becomes a shareholder and part of the network around it.']
  ];

  var EQUITY = [['5%', 'Seed to Fruit'], ['5%', 'The Room'], ['5%', 'Partner']];

  /* ── helpers ─────────────────────────────────────────────────── */
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function initials(name) {
    return name.replace(/^@/, '').split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  // Open sprints read green; a wrapped one is stated in the ink colour.
  function statusColor(s) { return s.phase === 'wrapped' ? 'var(--ink-soft)' : 'var(--green)'; }
  var OPEN = SPRINTS.filter(function (s) { return s.phase === 'open'; });
  // Panel index for a sprint code, so panels can cross-link by code.
  function panelIndexOf(code) {
    var i = SPRINTS.findIndex(function (s) { return s.code === code; });
    return i < 0 ? -1 : INTRO + i;
  }
  // The designed empty state for copy that has not landed yet.
  function tbc(what) { return '<div class="tbc">[ ' + esc(what) + ' ]</div>'; }

  /* ── panel model ─────────────────────────────────────────────── */
  var INTRO = 3; // hero, thesis, the room
  var PANELS = [
    { type: 'hero',   label: 'Sprints' },
    { type: 'thesis', label: 'Thesis' },
    { type: 'room',   label: 'The room' }
  ].concat(SPRINTS.map(function (s, i) {
    return {
      type: 'sprint', sprint: s, index: i,
      label: s.phase === 'wrapped' ? 'Cohort 01 · wrapped' : 'The cohort'
    };
  })).concat([
    { type: 'equity', label: 'Equity' },
    { type: 'why1',   label: 'Why Sprints' },
    { type: 'why2',   label: 'Why Sprints' },
    { type: 'how',    label: 'How it works' }
  ]);

  var JUMP = {
    room:   2,
    cohort: INTRO,
    equity: INTRO + SPRINTS.length,
    why:    INTRO + SPRINTS.length + 1,
    how:    INTRO + SPRINTS.length + 3
  };

  /* ── renderers ───────────────────────────────────────────────── */
  function heroPanel() {
    var wrapped = SPRINTS.length - OPEN.length;
    var links = [
      ['00', 'the room', JUMP.room],
      ['01', 'the cohort', JUMP.cohort],
      ['02', 'equity', JUMP.equity],
      ['03', 'why sprints', JUMP.why],
      ['04', 'how it works', JUMP.how]
    ].map(function (l) {
      return '<button class="sb-key" data-go="' + l[2] + '">' +
        '<span class="sb-kl">' + l[1] + '</span>' +
        '<span class="sb-ks"> : </span>' +
        '<span class="sb-kv">' + l[0] + ' →</span></button>';
    }).join('');

    return '<div class="hero">' +
      '<div class="eyebrow hero__eyebrow"># README · Sprints — by Seed to Fruit</div>' +
      '<div class="hero__wordmark"><h1>SPRINTS</h1><span class="hero__mark"></span></div>' +
      '<p class="hero__lede"><span class="caret">&gt;</span>an experiment in assembling companies, by Seed to Fruit</p>' +
      '<div class="hero__counts">' +
        '<span><b>' + pad(OPEN.length) + '</b> open sprint' + (OPEN.length === 1 ? '' : 's') + '</span>' +
        '<span class="sep">·</span>' +
        '<span><b>' + pad(wrapped) + '</b> wrapped</span>' +
      '</div>' +
      '<div class="hero__jump">' + links + '</div>' +
    '</div>';
  }

  function thesisPanel() {
    return '<div class="thesis">' +
      '<div class="eyebrow"># Thesis</div>' +
      '<p>Sprints brings together 8–12 people who’ve spent years inside a problem. ' +
      'Two weeks of intensive work, and everyone in the room owns a piece of what gets built.</p>' +
    '</div>';
  }

  function builderCard(b) {
    var filled = !!b.img;
    var visual = filled
      ? '<div class="bld__photo" style="background-image:url(&quot;' + esc(b.img) + '&quot;);background-position:' + esc(b.imgPos || 'center 12%') + '"></div>' +
        '<div class="bld__scrim"></div>'
      : '<div class="bld__placeholder"></div>';
    var text = '<div class="bld__chip"><span class="dot">●</span>' + esc(b.name) + '</div>' +
      (filled
        ? (b.line ? '<div class="bld__line">' + esc(b.line) + '</div>' : '') +
          '<div class="bld__sprint">' + esc(b.sprint) + '</div>'
        : '');
    return '<div class="bld' + (filled ? ' bld--filled' : '') + '" data-filled="' + (filled ? '1' : '') + '">' +
      '<div class="bld__frame">' + visual + '<div class="bld__text">' + text + '</div></div>' +
    '</div>';
  }

  function roomPanel() {
    return '<div class="room">' +
      '<div class="head eyebrow"><span># 00 · The room</span></div>' +
      '<h2>Builders only</h2>' +
      '<p class="prose room__sub">Come to solve a hard problem, work without permission, and ship something you’d put your name on. Sounds intense? It is.</p>' +
      '<button class="btn-solid" data-go="' + JUMP.cohort + '">See the open sprint' + (OPEN.length === 1 ? '' : 's') + ' →</button>' +
      '<div class="rail" id="rail">' + BUILDERS.map(builderCard).join('') + '</div>' +
    '</div>';
  }

  function metaGrid(s) {
    var html = [['dates', s.dates], ['place', s.location], ['team', s.team]].map(function (r) {
      return '<div><span class="label">' + r[0] + '</span><span class="val">' + esc(r[1]) + '</span></div>';
    }).join('');
    html += '<div><span class="label">status</span><span class="val" style="color:' + statusColor(s) + '">● ' +
      esc(s.status) + ' · ' + esc(s.statusNote) + '</span></div>';
    return '<div class="metagrid">' + html + '</div>';
  }

  // `role` is optional — the second line is dropped rather than faked.
  function roster(people) {
    return '<div class="roster">' + people.map(function (m) {
      return '<div class="roster__row">' +
        (m.img
          ? '<span class="avatar avatar--photo" style="background-image:url(&quot;' + esc(m.img) + '&quot;)' +
            (m.imgPos ? ';background-position:' + esc(m.imgPos) : '') + '"></span>'
          : '<span class="avatar' + (m.pending ? ' avatar--pending' : '') + '">' + esc(initials(m.name)) + '</span>') +
        '<div style="flex:1;min-width:0">' +
          '<div class="roster__name">' + esc(m.name) + '</div>' +
          (m.role ? '<div class="roster__role">' + esc(m.role) + '</div>' : '') +
        '</div>' +
        (m.li ? '<a class="roster__li" href="' + esc(m.li) + '" target="_blank" rel="noopener" aria-label="' + esc(m.name) + ' on LinkedIn">in →</a>' : '') +
      '</div>';
    }).join('') + '</div>';
  }

  function plusList(items) {
    return '<div class="plus-list">' + items.map(function (b) {
      return '<div><span class="plus">+</span><span>' + esc(b) + '</span></div>';
    }).join('') + '</div>';
  }

  function feed(s) {
    return '<div class="feed">' + s.posts.map(function (p, i) {
      var parts = p.when.split('·');
      return '<div class="feed__item sb-feedin" style="animation-delay:' + (i * 90) + 'ms">' +
        '<div class="feed__rail"><span class="feed__node"></span>' +
          (i < s.posts.length - 1 ? '<span class="feed__stem"></span>' : '') +
        '</div>' +
        '<div>' +
          '<div class="feed__when"><b>' + esc((parts[0] || '').trim()) + '</b>&nbsp;&nbsp;·&nbsp;&nbsp;' + esc((parts[1] || '').trim()) + '</div>' +
          '<div class="feed__title">' + esc(p.title) + '</div>' +
          '<div class="feed__body">' + esc(p.body) + '</div>' +
        '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function companyBlock(c) {
    return '<div class="sponsor-strip">' +
      '<div class="label sponsor-strip__label">Company formed</div>' +
      '<div class="sponsor-strip__row">' +
        '<div class="sponsor-strip__mark">' + esc(initials(c.name)) + '</div>' +
        '<div>' +
          '<div class="sponsor-strip__name">' + esc(c.name) + '</div>' +
          (c.stage ? '<div class="sponsor-strip__kind">' + esc(c.stage) + '</div>' : '') +
        '</div>' +
      '</div>' +
      (c.line ? '<div class="sprint__nowbuilding" style="max-width:40ch">' + esc(c.line) + '</div>' : '') +
      (c.what ? '<p class="prose sprint__problem" style="margin-top:12px">' + esc(c.what) + '</p>' : '') +
    '</div>';
  }

  function sprintPanel(s) {
    var wrapped = s.phase === 'wrapped';

    var visual = s.img
      ? '<div class="sprint__photo" style="background-image:url(&quot;' + esc(s.img) + '&quot;);background-position:' + esc(s.imgPos || 'center') +
        (s.imgFit ? ';--img-fit:' + esc(s.imgFit) : '') + '"></div>'
      : '<div class="sprint__placeholder">' +
          '<div class="sprint__initials">' + esc(initials(s.partner)) + '</div>' +
          '<div class="sprint__ph-note">[ partner portrait ]</div>' +
          '<div class="sprint__ph-name">' + esc(s.partner) + '</div>' +
        '</div>';

    var overlay = '<div class="sprint__overlay">' +
      '<div class="sprint__head">' +
        '<span style="color:var(--accent)"># 01 · The cohort</span>' +
        '<span class="code">// ' + esc(s.code) + (wrapped ? ' · wrapped' : '') + '</span>' +
      '</div>' +
      '<div class="sprint__space">' + esc(s.title || s.space) + '</div>' +
      (s.title
        ? '<div class="sprint__spacetag">' + esc(s.space) +
          (s.round ? '<span class="sep">·</span>' + esc(s.round) : '') + '</div>'
        : '') +
      '<div class="sprint__partner">' + esc(s.partner) + '</div>' +
      '<div class="sprint__credential">' + esc(s.credential) + '</div>' +
      (wrapped
        ? '<div class="sprint__progress-pill sprint__progress-pill--done"><span class="dot">●</span>' +
          'Wrapped · cohort 01 complete</div>'
        : '') +
    '</div>';

    var info = wrapped ? wrappedInfo(s) : openInfo(s);

    return '<div class="sprint">' +
      '<div class="sprint__visual">' + visual + '<div class="sprint__scrim"></div>' + overlay + '</div>' +
      '<div class="sprint__info sb-scroll' + (wrapped ? ' sprint__info--building' : '') + '">' + info + '</div>' +
    '</div>';
  }

  // An open sprint: the pitch, then the ask.
  function openInfo(s) {
    var prior = s.continues ? panelIndexOf(s.continues) : -1;
    return '<div class="head eyebrow"><span># 01 · The cohort</span></div>' +
      '<div class="sprint__oneline">' + esc(s.oneLine) + '</div>' +
      (prior >= 0
        ? '<button class="xref" data-go="' + prior + '">' +
          'Cohort 01 ran on this problem — see what the room built <span>→</span></button>'
        : '') +
      '<div class="block block--problem">' +
        '<span class="label block__label">The problem</span>' +
        '<p class="sprint__problem">' + esc(s.problem) + '</p>' +
      '</div>' +
      (s.question
        ? '<div class="question"><span class="label block__label">The question</span>' +
          '<p class="question__body">' + esc(s.question) + '</p></div>'
        : '') +
      (s.ships
        ? '<div class="block"><span class="label block__label">What ships in two weeks</span>' + plusList(s.ships) + '</div>'
        : '') +
      metaGrid(s) +
      '<div style="margin-top:4px"><a class="btn-solid" href="' + REQUEST_URL + '">Request to join <span>→</span></a></div>';
  }

  // A wrapped sprint: the outcome, then the people who made it.
  function wrappedInfo(s) {
    var next = OPEN.length ? panelIndexOf(OPEN[0].code) : -1;
    return (next >= 0
        ? '<button class="xref" data-go="' + next + '">' +
          'A second room is forming on this problem <span>→</span></button>'
        : '') +
      '<div>' +
        '<div class="label" style="margin-bottom:13px">Outcome</div>' +
        (s.company ? companyBlock(s.company) : tbc('company to be announced')) +
      '</div>' +
      '<div class="block"><div class="block__head"><span>The problem they worked on</span></div>' +
        (s.problem ? '<p class="sprint__problem">' + esc(s.problem) + '</p>' : tbc('problem write-up pending')) +
      '</div>' +
      '<div class="block"><div class="block__head"><span>The founders</span></div>' +
        (s.founders ? roster(s.founders) : tbc('founding team to be announced')) +
      '</div>' +
      '<div class="block"><div class="block__head"><span>The room</span><span>' + s.room.length + ' builders</span></div>' +
        roster(s.room) +
      '</div>' +
      (s.posts
        ? '<div class="block"><div class="block__head"><span>From the room</span></div>' + feed(s) + '</div>'
        : '') +
      metaGrid(s);
  }

  function equityPanel() {
    var rows = EQUITY.map(function (r) {
      return '<div><div class="n">' + r[0] + '</div><div class="l">' + r[1] + '</div></div>';
    }).join('');
    return '<div class="equity">' +
      '<div class="head eyebrow"><span># 02 · Equity</span></div>' +
      '<div class="equity__figure"><span class="n">85</span><span class="pct">%</span></div>' +
      '<h2>of every company goes to the founders who continue. The rest is held for the room.</h2>' +
      '<div class="equity__rows">' + rows +
        '<div class="equity__note"><p class="prose">Equity only activates if a company forms. If no team continues, the whole thing dissolves — but if 2–3 people commit, everyone in that room owns a piece.</p></div>' +
      '</div>' +
    '</div>';
  }

  function whyMathPanel() {
    return '<div class="why">' +
      '<div class="head head--center eyebrow"><span># 03 · Why Sprints</span></div>' +
      '<div class="why__stat">99%</div>' +
      '<h2>of startups will fail.</h2>' +
      '<p class="prose why__body">Everyone says that most startups fail, and that’s just the startup math. But is it? Or is it the predictable result of a specific way of assembling companies that almost nobody questions? We built Sprints to test that. It’s an experiment in assembling companies.</p>' +
    '</div>';
  }

  function whyBetPanel() {
    return '<div class="why why--bet">' +
      '<div class="head head--center eyebrow"><span># 03 · Why Sprints</span></div>' +
      '<h2>Right problem, right people, right time.</h2>' +
      '<p class="prose why__body">Almost everything else is secondary. Most accelerators will waste your time on: workshops, panels, pitch nights, and events. But the real work is in choosing the right problem, finding the right people, at the right time, and creating the conditions where a real company can emerge.</p>' +
    '</div>';
  }

  function howPanel() {
    return '<div class="how">' +
      '<div class="head eyebrow"><span># 04 · How it works</span></div>' +
      '<div>' + STEPS.map(function (s) {
        return '<div class="step">' +
          '<span class="step__ghost">' + s[0] + '</span>' +
          '<div class="step__body"><h3>' + esc(s[1]) + '</h3><p class="prose">' + esc(s[2]) + '</p></div>' +
        '</div>';
      }).join('') + '</div>' +
      '<footer class="footer">' +
        '<span>© 2026 Seed to Fruit. All rights reserved.</span>' +
        '<span>seedtofruit.ca/sprints · main · v0.1.0</span>' +
      '</footer>' +
    '</div>';
  }

  function renderPanel(p) {
    switch (p.type) {
      case 'hero':   return heroPanel();
      case 'thesis': return thesisPanel();
      case 'room':   return roomPanel();
      case 'sprint': return sprintPanel(p.sprint);
      case 'equity': return equityPanel();
      case 'why1':   return whyMathPanel();
      case 'why2':   return whyBetPanel();
      case 'how':    return howPanel();
    }
    return '';
  }

  /* ── mount ───────────────────────────────────────────────────── */
  var deck = document.getElementById('deck');
  deck.innerHTML = PANELS.map(function (p, i) {
    return '<section class="panel" data-panel data-i="' + i + '" aria-label="' + esc(p.label) + '">' +
      renderPanel(p) + '</section>';
  }).join('');

  var dotnav = document.getElementById('dotnav');
  dotnav.innerHTML = PANELS.map(function (p, i) {
    return '<button data-go="' + i + '"' + (p.type === 'sprint' ? ' data-sprint' : '') +
      ' aria-label="' + esc(p.type === 'sprint' ? 'Sprint ' + p.sprint.code : p.label) + '"><span></span></button>';
  }).join('');

  function isStacked() { return window.matchMedia('(max-width: 900px)').matches; }
  function prefersReduced() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

  /* Jumping more than one panel needs snapping off for the duration:
     `scroll-snap-stop: always` forbids passing a snap point, so a
     scripted multi-panel scroll would stop at the first one it meets.
     Snap is restored on scrollend, with a timeout fallback. */
  var snapRestore = null;
  function releaseSnap() {
    clearTimeout(snapRestore);
    snapRestore = setTimeout(function () { deck.classList.remove('is-jumping'); }, 1000);
  }
  deck.addEventListener('scrollend', function () {
    clearTimeout(snapRestore);
    deck.classList.remove('is-jumping');
  });

  function goTo(i) {
    i = Math.max(0, Math.min(PANELS.length - 1, i));
    var el = deck.querySelector('[data-i="' + i + '"]');
    if (!el) return;
    var smooth = prefersReduced() ? 'auto' : 'smooth';
    if (isStacked()) { el.scrollIntoView({ behavior: smooth, block: 'start' }); return; }
    deck.classList.add('is-jumping');
    deck.scrollTo({ top: el.offsetTop, behavior: smooth });
    releaseSnap();
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go]');
    if (t) { e.preventDefault(); goTo(Number(t.dataset.go)); }
  });

  /* ── active panel: top bar counter, dot nav, scroll hint ─────── */
  var topbarRight = document.getElementById('topbar-right');
  var hint = document.getElementById('hint');
  var hintLabel = document.getElementById('hint-label');
  var active = -1;

  function setActive(i) {
    if (i === active) return;
    active = i;
    var p = PANELS[i];

    Array.prototype.forEach.call(dotnav.children, function (b, n) {
      b.setAttribute('aria-current', n === i ? 'true' : 'false');
    });

    topbarRight.innerHTML = p.type === 'sprint'
      ? (p.sprint.phase === 'wrapped'
          ? '<span class="count-of">cohort 01 · wrapped</span>'
          : '<span class="count">' + pad(OPEN.indexOf(p.sprint) + 1) + '</span>' +
            '<span class="count-of">— ' + pad(OPEN.length) + ' open sprint' + (OPEN.length === 1 ? '' : 's') + '</span>')
      : '';

    if (i < PANELS.length - 1) {
      hint.hidden = false;
      hintLabel.textContent = PANELS[i + 1].label;
    } else {
      hint.hidden = true;
    }
  }

  hint.addEventListener('click', function () { goTo(active + 1); });

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) setActive(Number(e.target.dataset.i));
    });
  }, { root: isStacked() ? null : deck, threshold: 0.55 });
  deck.querySelectorAll('[data-panel]').forEach(function (el) { io.observe(el); });
  setActive(0);

  /* ── keyboard: arrows / page up-down step panels ─────────────── */
  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); goTo(active + 1); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); goTo(active - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(PANELS.length - 1); }
  });

  /* ─────────────────────────────────────────────────────────────
     Builders rail — GPU-composited transforms only (no per-frame
     backdrop-filter). Lays out on mount rather than on the first
     animation frame. Hover pauses, pointer drag scrubs, ~22s loop.
     ───────────────────────────────────────────────────────────── */
  (function buildRail() {
    var el = document.getElementById('rail');
    if (!el) return;

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    var cards = Array.prototype.slice.call(el.querySelectorAll('.bld'));
    var texts = cards.map(function (c) { return c.querySelector('.bld__text'); });
    var N = cards.length;
    var half = N / 2;
    var DRIFT = 0.16; // card-units per second — ~22s for a full nine-card loop
    var cw = 268, step = cw * 0.94;
    var st = { pos: 0, speed: 0, target: DRIFT, last: 0, raf: 0, drag: null };

    function scaleFor(d) { var a = Math.abs(d); return Math.max(0.42, 1 - 0.22 * a + 0.014 * a * a); }
    function opacityFor(d) { var a = Math.abs(d); return a < 1 ? 1 : Math.max(0, 1 - (a - 1) * 0.42); }
    function textOpacityFor(d) { return Math.max(0, Math.min(1, 1.6 - Math.abs(d))); }

    /* Card width is driven by the height the rail actually has, so the fan
       fills the panel instead of leaving dead space under it. 0.68 is the
       card aspect; the 0.94 leaves a little breathing room top and bottom. */
    function fit() {
      var railH = el.clientHeight || window.innerHeight * 0.4;
      cw = Math.max(150, Math.min(400, window.innerWidth * 0.26, railH * 0.68 * 0.94));
      step = cw * 0.94;
      el.style.setProperty('--bld-cw', cw + 'px');
    }

    function apply() {
      for (var i = 0; i < N; i++) {
        var d = ((i - st.pos) % N + N) % N;
        if (d > half) d -= N;
        var card = cards[i];
        var s = scaleFor(d), o = opacityFor(d);
        card.style.transform = 'translate(-50%, -50%) translate3d(' + (d * step).toFixed(2) + 'px, 0, 0) scale(' + s.toFixed(4) + ')';
        var op = o.toFixed(3);
        if (card.dataset.op !== op) { card.style.opacity = op; card.dataset.op = op; }
        var z = String(100 - Math.round(Math.abs(d) * 10));
        if (card.dataset.z !== z) { card.style.zIndex = z; card.dataset.z = z; }
        var vis = o <= 0.01 ? 'hidden' : 'visible';
        if (card.dataset.vis !== vis) { card.style.visibility = vis; card.dataset.vis = vis; }
        var txt = texts[i];
        if (txt) {
          var base = textOpacityFor(d);
          var to = (card.dataset.filled ? base : Math.min(1, base + 0.3)).toFixed(3);
          if (txt.dataset.to !== to) { txt.style.opacity = to; txt.dataset.to = to; }
        }
      }
    }

    function tick(now) {
      var dt = Math.min(0.05, (now - st.last) / 1000);
      st.last = now;
      st.speed += (st.target - st.speed) * Math.min(1, dt * 4);
      if (!st.drag) st.pos += st.speed * dt;
      apply();
      st.raf = requestAnimationFrame(tick);
    }

    function reset() {
      cards.forEach(function (c) {
        c.style.transform = ''; c.style.opacity = ''; c.style.visibility = ''; c.style.zIndex = '';
        delete c.dataset.op; delete c.dataset.z; delete c.dataset.vis;
      });
      texts.forEach(function (t) { if (t) { t.style.opacity = ''; delete t.dataset.to; } });
    }

    function start() {
      cancelAnimationFrame(st.raf);
      st.raf = 0;
      if (isStacked() || reduce.matches) { reset(); return; }
      fit();
      apply(); // lay the fan out at first paint, independent of rAF timing
      st.last = performance.now();
      st.raf = requestAnimationFrame(tick);
    }

    el.addEventListener('pointerenter', function () { st.target = 0; });
    el.addEventListener('pointerleave', function () { st.target = DRIFT; });
    el.addEventListener('pointerdown', function (e) {
      if (isStacked() || reduce.matches) return;
      st.drag = { x: e.clientX, pos: st.pos };
      el.setPointerCapture(e.pointerId);
      el.classList.add('is-dragging');
    });
    el.addEventListener('pointermove', function (e) {
      if (st.drag) st.pos = st.drag.pos - (e.clientX - st.drag.x) / step;
    });
    ['pointerup', 'pointercancel'].forEach(function (ev) {
      el.addEventListener(ev, function () { st.drag = null; el.classList.remove('is-dragging'); });
    });

    window.addEventListener('resize', start);
    if (reduce.addEventListener) reduce.addEventListener('change', start);
    start();
  })();
})();
</script>
</body>
</html>
